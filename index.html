
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angemax Trailers</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: #e50914;
      padding: 25px 10px;
      font-size: 30px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    .trailer {
      background: #222;
      margin: 20px auto;
      padding: 15px;
      max-width: 700px;
      border-radius: 12px;
    }

    .trailer h2 {
      margin-top: 5px;
    }

    video {
      width: 100%;
      border-radius: 10px;
      background: black;
    }
  </style>
</head>

<body>

  <header>
    🎬 ANGEMAX
  </header>

  <div class="container">

    <div class="trailer">
      <h2>Movie Trailer 1</h2>
      <video controls>
        <source src="trailer1.mp4" type="video/mp4">
        Your browser does not support video.
      </video>
    </div>

    <div class="trailer">
      <h2>Movie Trailer 2</h2>
      <video controls>
        <source src="trailer2.mp4" type="video/mp4">
        Your browser does not support video.
      </video>
    </div>

  </div>

</body>
</html>
