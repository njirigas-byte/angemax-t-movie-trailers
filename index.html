<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angemax - Play Now</title>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial,sans-serif}
header{padding:20px;display:flex;justify-content:space-between;align-items:center;background:#111;position:sticky;top:0}
.logo{font-size:28px;font-weight:900;letter-spacing:2px}
.logo span{color:#e50914}
#search{padding:10px 20px;border-radius:20px;border:none;width:200px;background:#222;color:white}
.hero{padding:60px 20px;text-align:center;background:linear-gradient(to bottom,#111,#0a0a0a)}
.hero h1{font-size:50px;margin:0}
.hero h1 span{color:#e50914}
.btn{background:#e50914;color:white;padding:12px 30px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;margin-top:20px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:20px}
.card{background:#1a1a1a;border-radius:10px;overflow:hidden;cursor:pointer;transition:0.3s}
.card:hover{transform:scale(1.05)}
.card img{width:100%;height:240px;object-fit:cover}
.card .info{padding:10px}
.card .title{font-size:14px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .year{font-size:12px;color:#888}
#movies{min-height:300px}
</style>
</head>
<body>
<header>
<div class="logo">ANGE<span>MAX</span></div>
<input id="search" placeholder="Search movies..." onkeyup="searchMovie(this.value)">
</header>

<div class="hero">
<h1>ANGE<span>MAX</span></h1>
<p>Unlimited Movies, TV Shows & More</p>
<button class="btn" onclick="loadMovies()">▶️ PLAY NOW</button>
</div>

<div id="movies" class="grid"></div>

<script>
const API_KEY = "YOUR_TMDB_API_KEY_HERE"; // Weka key yako hapa
const IMG = "https://image.tmdb.org/t/p/w500";

async function loadMovies(){
  // Kama huna key, inaonyesha demo movies
  if(API_KEY === "YOUR_TMDB_API_KEY_HERE"){
    document.getElementById("movies").innerHTML = `
      <div class="card"><img src="https://via.placeholder.com/500x750?text=Angemax"><div class="info"><div class="title">Add TMDB Key to see movies</div><div class="year">2026</div></div></div>
      <div class="card"><img src="https://via.placeholder.com/500x750?text=Movie+1"><div class="info"><div class="title">Demo Movie</div><div class="year">2026</div></div></div>
    `;
    alert("Ongeza TMDB API key kwenye line 42 ya code! \nNenda themoviedb.org/settings/api");
    return;
  }
  const res = await fetch(⁠ https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY} ⁠);
  const data = await res.json();
  show(data.results);
}

async function searchMovie(q){
  if(!q || API_KEY === "YOUR_TMDB_API_KEY_HERE") return;
  const res = await fetch(⁠ https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${q} ⁠);
  const data = await res.json();
  show(data.results);
}

function show(movies){
  document.getElementById("movies").innerHTML = movies.map(m => `
    <div class="card" onclick="alert('${m.title}\\nRating: ${m.vote_average}')">
      <img src="${m.poster_path ? IMG+m.poster_path : 'https://via.placeholder.com/500x750?text=No+Image'}">
      <div class="info">
        <div class="title">${m.title}</div>
        <div class="year">${(m.release_date||'').slice(0,4)} • ⭐ ${m.vote_average}</div>
      </div>
    </div>
  `).join('');
}

// Auto load
loadMovies();
</script>
</body>
</html>
