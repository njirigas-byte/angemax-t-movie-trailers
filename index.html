<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angemax T-Movie Trailers</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 25px 10px;
      background: #000;
    }

    header img {
      width: 220px;
      max-width: 80%;
      height: auto;
      border-radius: 10px;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 28px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .movie {
      background: #1d1d1d;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .movie h2 {
      margin-top: 0;
    }

    .trailer-btn {
      display: inline-block;
      padding: 12px 22px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .trailer-btn:hover {
      background: #b20710;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <img src="logo png.jpeg" alt="Angemax Logo">
    <h1>ANGEMAX T-MOVIE TRAILERS</h1>
    <div class="subtitle">Watch the latest movie trailers</div>
  </header>

  <div class="container">

    <div class="movie">
      <h2>Red Notice</h2>
      <p>Official Movie Trailer</p>
      <a class="trailer-btn"
         href="https://www.youtube.com/watch?v=Pj0wz7zu3Ms"
         target="_blank">
        ▶️ WATCH TRAILER
      </a>
    </div>

    <div class="movie">
      <h2>The Covenant</h2>
      <p>Official Movie Trailer</p>
      <a class="trailer-btn"
         href="https://www.youtube.com/results?search_query=The+Covenant+official+trailer"
         target="_blank">
        ▶️ WATCH TRAILER
      </a>
    </div>

  </div>

  <footer>
    ©️ 2026 Angemax T-Movie Trailers
  </footer>

</body>
</html>
