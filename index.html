
<!-- MOVIE EXPLANATION FEATURE -->
<style>
.movie-explanation-btn {
  background: #e50914;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
}

.movie-explanation-btn:hover {
  background: #b20710;
}

.movie-explanation {
  display: none;
  background: #181818;
  color: white;
  padding: 16px;
  margin-top: 12px;
  border-radius: 10px;
  line-height: 1.6;
}

.movie-explanation.show {
  display: block;
}
</style>

<script>
function addMovieExplanation(button, explanation) {
  const box = document.createElement("div");
  box.className = "movie-explanation";
  box.textContent = explanation;

  button.classList.add("movie-explanation-btn");
  button.textContent = "📖 Read Movie Explanation";
  button.insertAdjacentElement("afterend", box);

  button.addEventListener("click", () => {
    const isOpen = box.classList.toggle("show");
    button.textContent = isOpen
      ? "✖ Hide Explanation"
      : "📖 Read Movie Explanation";
  });
}
</script>

<!-- EXAMPLE: ADD THIS TO A MOVIE CARD -->
<div class="movie-card">
  <h3>John Wick: Chapter 4</h3>

  <button onclick="addMovieExplanation(
    this,
    'John Wick fights to earn his freedom from the powerful High Table. His journey takes him across different countries, where he faces dangerous assassins and powerful enemies in a battle for survival.'
  )">
    📖 Read Movie Explanation
  </button>
</div>
