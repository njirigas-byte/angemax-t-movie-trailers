<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angemax Movie Trailers</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #e50914;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .trailer {
      background: #222;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 12px;
    }

    .trailer h2 {
      margin-top: 0;
    }

    .trailer iframe {
      width: 100%;
      height: 450px;
      border: none;
      border-radius: 10px;
    }

    .watch {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #aaa;
    }

    @media (max-width: 600px) {
      .trailer iframe {
        height: 220px;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 ANGEMAX</h1>
    <p>Latest Movie Trailers</p>
  </header>

  <div class="container">

    <div class="trailer">
      <h2>Movie Trailer 1</h2>

      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID_1"
        allowfullscreen>
      </iframe>

      <a class="watch" href="https://www.youtube.com/" target="_blank">
        ▶️ Watch Trailer
      </a>
    </div>

    <div class="trailer">
      <h2>Movie Trailer 2</h2>

      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID_2"
        allowfullscreen>
      </iframe>

      <a class="watch" href="https://www.youtube.com/" target="_blank">
        ▶️ Watch Trailer
      </a>
    </div>

  </div>

  <footer>
    ©️ 2026 Angemax — Movie Trailers
  </footer>

</body>
</html>
